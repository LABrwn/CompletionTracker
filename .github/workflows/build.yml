# Builds the mod on every push. On the main branch the finished .jar is published
# as the release "Neueste Version", so it can be downloaded without unpacking a zip.
name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Dump Minecraft API signatures
        if: always()
        run: ./tools/dump-api.sh
      - name: Publish build log and API dump to branch "ci-output"
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p /tmp/ci-out && cp -r api-dump /tmp/ci-out/ 2>/dev/null; cp build-log.txt /tmp/ci-out/ 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_number }} result ${{ job.status }}" > /tmp/ci-out/RUN.txt
          git fetch origin ci-output || true
          git checkout --orphan ci-output-tmp
          git rm -rf . -q
          cp -r /tmp/ci-out/* .
          git add -A
          git commit -q -m "CI output for ${{ github.sha }}"
          git push -f origin HEAD:ci-output

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v7
        with:
          name: completiontracker-jar
          path: build/libs/*.jar
      - name: Publish release "Neueste Version"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste-version --yes --cleanup-tag || true
          gh release create neueste-version build/libs/completiontracker-*.jar \
            --title "Neueste Version (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Die .jar-Datei unten herunterladen und in den mods-Ordner ziehen." \
            --latest
